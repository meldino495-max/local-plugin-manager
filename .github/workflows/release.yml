name: Release Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default least privilege; release job elevates write only for publishing.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Security smoke (no network)
        run: python scripts/security_smoke.py

      - name: Build exe
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/build_exe.py

      - name: Upload artifact
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LocalPluginManager-windows-x64
          path: dist/本地插件管理器.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LocalPluginManager-windows-x64
          path: release-assets

      - name: Rename with tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Reject unexpected tag characters before interpolating into filenames.
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Refusing unexpected tag name: $TAG" >&2
            exit 1
          fi
          mv "release-assets/本地插件管理器.exe" \
             "release-assets/本地插件管理器-${TAG}-windows-x64.exe"
          ls -la release-assets

      - name: Publish GitHub Release
        # softprops/action-gh-release@v3.0.3 (Node 24)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: release-assets/本地插件管理器-*-windows-x64.exe
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
